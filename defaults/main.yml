---
fsviewer_version: 2.5.1

fsviewer_arch: "{{ fsviewer_arch_map[ansible_architecture] }}"

fsviewer_user: fsviewer
fsviewer_group: fsviewer

fsviewer_extra_groups: []

fsviewer_home_dir: /home/{{ fsviewer_user }}

fsviewer_env: []
#  - access_token=abcdef0123
#  - DISPLAY=:1

fsviewer_options: []
#  - --no-sandbox
#  - --disable-gpu

fsviewer_dependencies:
  - libasound2
  - libgbm1
  - libgtk-3-0
  - libnotify4
  - libnss3
  - libsecret-1-0
  - libxss1
  - libxtst6
